version: '3.8'

services:
  api:
    image: ghcr.io/elie222/rakazo/api:edge
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - API_HOST=0.0.0.0
      - API_PORT=3100
      - DATABASE_URL=${DATABASE_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SCREEN_PROXY_SECRET=${SCREEN_PROXY_SECRET}
      - WEB_ORIGIN=${WEB_ORIGIN}
      - BETTER_AUTH_URL=${WEB_ORIGIN}
    ports:
      - "3100:3100"

  worker:
    image: ghcr.io/elie222/rakazo/worker:edge
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}

  sandbox-supervisor:
    image: ghcr.io/elie222/rakazo/sandbox-supervisor:edge
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - SUPERVISOR_HOST=0.0.0.0
      - SUPERVISOR_PORT=7091
      - SUPERVISOR_TOKEN=${SANDBOX_SUPERVISOR_TOKEN}
    ports:
      - "7091:7091"

  web:
    image: ghcr.io/elie222/rakazo/web:edge
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-5173}
      - VITE_API_URL=http://api:3100
      - PUBLIC_API_URL=http://api:3100
      - BETTER_AUTH_URL=${WEB_ORIGIN}
      - WEB_ORIGIN=${WEB_ORIGIN}
    ports:
      - "${PORT:-5173}:${PORT:-5173}"
