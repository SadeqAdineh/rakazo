[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:postgres]
command=/usr/local/bin/docker-entrypoint.sh postgres
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/postgres.log
stderr_logfile=/var/log/supervisor/postgres.err
priority=10

[program:api]
command=pnpm --filter @rakazo/api start
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/api.log
stderr_logfile=/var/log/supervisor/api.err
priority=30
environment=NODE_ENV="production",API_HOST="0.0.0.0"

[program:worker]
command=pnpm --filter @rakazo/worker start
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/worker.log
stderr_logfile=/var/log/supervisor/worker.err
priority=40

[program:supervisor]
command=pnpm --filter @rakazo/sandbox-supervisor start
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/sandbox-supervisor.log
stderr_logfile=/var/log/supervisor/sandbox-supervisor.err
priority=35
environment=SUPERVISOR_HOST="0.0.0.0",SUPERVISOR_PORT="7091"

[program:web]
command=pnpm --filter @rakazo/web preview --host 0.0.0.0 --port 5173
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/web.log
stderr_logfile=/var/log/supervisor/web.err
priority=50
