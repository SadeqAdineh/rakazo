[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=node

[program:api]
command=pnpm --filter @rakazo/api start
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/api.log
stderr_logfile=/var/log/supervisor/api.err
priority=30
environment=NODE_ENV="production",API_HOST="0.0.0.0",API_PORT="3100",DATABASE_URL="%(ENV_DATABASE_URL)s"

[program:worker]
command=pnpm --filter @rakazo/worker start
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/worker.log
stderr_logfile=/var/log/supervisor/worker.err
priority=40
environment=NODE_ENV="production",DATABASE_URL="%(ENV_DATABASE_URL)s"

[program:sandbox-supervisor]
command=pnpm --filter @rakazo/sandbox-supervisor start
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/sandbox-supervisor.log
stderr_logfile=/var/log/supervisor/sandbox-supervisor.err
priority=35
environment=NODE_ENV="production",SUPERVISOR_HOST="0.0.0.0",SUPERVISOR_PORT="7091",SUPERVISOR_TOKEN="%(ENV_SANDBOX_SUPERVISOR_TOKEN)s"

[program:web]
# Build the web app (if not already built) and preview on Railway's $PORT
command=sh -c "pnpm --filter @rakazo/web build && pnpm --filter @rakazo/web preview --host 0.0.0.0 --port ${PORT:-5173}"
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/web.log
stderr_logfile=/var/log/supervisor/web.err
priority=50
environment=NODE_ENV="production",PORT="%(ENV_PORT)s",VITE_API_URL="http://localhost:3100",PUBLIC_API_URL="http://localhost:3100",BETTER_AUTH_URL="%(ENV_WEB_ORIGIN)s",WEB_ORIGIN="%(ENV_WEB_ORIGIN)s"
